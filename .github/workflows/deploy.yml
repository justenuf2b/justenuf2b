name: Deploy to OCI Object Storage via PAR
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload to OCI bucket root
        shell: bash
        env:
          OCI_PAR_BASE: ${{ secrets.OCI_PAR_BASE }}
        run: |
          set -euo pipefail

          # Normalize base. Secret should end with .../b/<bucket>/o (no trailing slash)
          BASE="${OCI_PAR_BASE%/}"

          # Where files live. If using a folder like site/, set SOURCE_DIR="site" and STRIP_PREFIX="site/"
          SOURCE_DIR="."
          STRIP_PREFIX=""

          # Collect files
          mapfile -t FILES < <(find "$SOURCE_DIR" -type f \
            \( -name '*.html' -o -name '*.css' -o -name '*.js' -o \
               -name '*.png' -o -name '*.jpg' -o -name '*.svg' -o \
               -name '*.ico' -o -name '*.txt' -o -name '*.json' \))

          echo "Uploading ${#FILES[@]} files..."
          for f in "${FILES[@]}"; do
            REL="${f#$STRIP_PREFIX}"
            REL="${REL#./}"   # drop leading ./ if present
            REL="${REL#/}"    # drop leading / if present

            CT="$(file --mime-type -b "$f" || echo application/octet-stream)"
            URL="${BASE}/${REL}"

            echo "PUT ${REL}"
            curl -fsS -X PUT -T "$f" \
              -H "Content-Type: $CT" \
              -H "Cache-Control: public, max-age=600" \
              "$URL"
          done

          echo "Done."
